name: Build and Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
  #schedule:
  #  - cron: "0 0 * * 1" # 每周一 UTC 0:00

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: agent.cpp-Linux
            asset_suffix: .tar.gz
            executable_name: agent-cpp-linux
          - os: windows-latest
            artifact_name: agent.cpp-Windows
            asset_suffix: .zip
            executable_name: agent-cpp-windows.exe
          - os: macos-latest
            artifact_name: agent.cpp-Darwin
            asset_suffix: .tar.gz
            executable_name: agent-cpp-macos

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # ---------- Linux: Alpine (musl) 容器内全静态编译 ----------
      # 产出完全静态链接的 ELF 二进制，不依赖 glibc/curl/libsodium 等任何系统库
      - name: Build fully static (Linux, Alpine musl)
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" -w /work \
            alpine:3.20 /bin/sh -c '
            set -ex
            apk add --no-cache \
              build-base cmake ninja-build git \
              boost-dev \
              libsodium-dev libsodium-static \
              openssl-dev openssl-libs-static zlib-dev zlib-static \
              ca-certificates-bundle
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTATIC_BUILD=ON
            cmake --build build --parallel
            cmake --install build --prefix install
            cd build && cpack -G TGZ
            '

      # ---------- macOS 依赖 ----------
      # curl/libsodium 由 CMake 从源码静态构建（SecureTransport），无需系统库
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja

      # ---------- Windows (MSYS2) 依赖 ----------
      # curl 由 CMake 从源码静态构建（Schannel），无需 mingw 版 curl
      - name: Setup MSYS2 and install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-boost mingw-w64-x86_64-libsodium

      # ---------- CMake 配置 ----------
      - name: Configure CMake (Windows MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTATIC_BUILD=ON

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSTATIC_BUILD=ON

      # ---------- 编译 ----------
      - name: Build (Windows MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: cmake --build build --config Release --parallel

      # ---------- 安装 ----------
      - name: Install (staging)
        if: runner.os != 'Linux'
        shell: bash
        run: cmake --install build --prefix install

      # ---------- 验证零依赖 ----------
      - name: Verify zero dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          file install/app
          ldd install/app || true
          if file install/app | grep -q "statically linked"; then
            echo "OK: Linux binary is fully static"
          else
            echo "FAIL: Linux binary is NOT fully static"
            exit 1
          fi

      - name: Verify zero dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          otool -L install/app
          EXTRA=$(otool -L install/app | tail -n +2 | grep -oE '^\s*/[^ ]+' | grep -vE '^/usr/lib/|^/System/Library/' || true)
          if [ -z "$EXTRA" ]; then
            echo "OK: macOS binary only uses Apple system libraries"
          else
            echo "FAIL: unexpected dynamic dependencies:"
            echo "$EXTRA"
            exit 1
          fi

      - name: Verify zero dependencies (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          objdump -p install/app.exe | grep "DLL Name" || echo "(no DLL imports at all)"
          if objdump -p install/app.exe | grep "DLL Name" | grep -iE "curl|sodium|ssl|crypto|stdc|gcc|winpthread|zlib|brotli|zstd|nghttp|idn|psl|ssh|iconv|intl"; then
            echo "FAIL: executable imports non-Windows runtime DLLs"
            exit 1
          else
            echo "OK: Windows executable has no external runtime DLL dependencies"
          fi

      # ---------- 打包 ----------
      - name: Package with CPack (Windows MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd build
          cpack -G ZIP

      - name: Package with CPack (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd build
          cpack -G TGZ

      # ---------- 确定最终包名 ----------
      - name: Determine package file name
        id: package
        shell: bash
        run: |
          cd build
          # Nightly 事件下已经是固定名称，Stable 事件则自动检测
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PKG_FILE="${{ matrix.artifact_name }}${{ matrix.asset_suffix }}"
          else
            PKG_FILE=$(ls *${{ matrix.asset_suffix }} | head -1)
          fi
          echo "pkg_file=$PKG_FILE" >> $GITHUB_OUTPUT
          echo "pkg_path=build/$PKG_FILE" >> $GITHUB_OUTPUT

      # ---------- 准备单独的可执行文件 ----------
      - name: Prepare executable artifact
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            SRC="install/app.exe"
          else
            SRC="install/app"
          fi
          DST="${{ matrix.executable_name }}"
          cp "$SRC" "$DST"
          if [ "$RUNNER_OS" != "Windows" ]; then
            chmod +x "$DST"
          fi
          echo "exec_path=$DST" >> $GITHUB_OUTPUT

      - name: Upload executable artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}-executable
          path: ${{ matrix.executable_name }}

      # ---------- 上传压缩包 ----------
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.package.outputs.pkg_path }}

  release-nightly:
    name: Create Nightly Build ${{ github.run_number }}
    # 触发条件保持不变
    if:
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 注意：你需要先 checkout，因为要用到 release.md 文件
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 关键修改：使用 GitHub 运行编号作为动态标签
          # 比如：nightly-123
          tag_name: nightly-${{ github.run_number }}
          # 名字可以加上运行编号，方便区分
          name: agent.cpp Nightly Build Run #${{ github.run_number }}
          # 关键修改：用 body_path 而不是 body，这样才能读取 release.md 文件内容
          body_path: release.md
          files: artifacts/**/*
          fail_on_unmatched_files: true
          overwrite: false
