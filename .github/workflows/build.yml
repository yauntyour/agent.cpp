name: build

# 多平台 CMake 构建：Windows (MSYS2 UCRT64) / Linux (GCC) / macOS (Apple clang)。
#
# 触发条件（只有这两个）：
#   1. push 到 main / master，且这次 push 的最新一条 commit 消息里含 "release"
#      （不区分大小写，只看首行：`release` / `release: v0.2` / `Release 0.2` 都算）；
#      不含就整条流水线跳过，只留一个 gate job 记一笔。
#   2. 手动 workflow_dispatch；勾 publish 时构建完顺便发 Release（tag 由输入框给）。
#
# 关于 C++ 标准：cell.cpp 无条件 include <generator> / <expected> / <format>，
# 所以工具链的下限是 libstdc++ >= 14（GCC 14）或 libc++ >= 19（Xcode >= 16.3）。
# 这不是「-std=c++23 就能退」的事 —— 老 libc++ 根本没有这个头文件。每个 job 都
# 先用 `#include <generator>` 探一次，探不到直接报错，别等到编了三分钟才炸。
# 注意 macOS：brew 的 llvm 是 keg-only，它的 libc++ 头/库都不在默认搜索路径里，
# 光 `brew install llvm` 不改搜索路径等于没换（详见 macos job 里那一步的注释）。
# 另外 CMakeLists 默认 AGENT_CXX_STANDARD=26，而 #embed 要 GCC >= 15 / Clang >= 19，
# 拿不到 #embed 时 build_live2d.py 会把 kAssetCount 置 0（exe 不带默认 Live2D 模型）。

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish:
        description: 构建完成后发 Release（需要填 tag）
        type: boolean
        default: false
      tag:
        description: 发布用的 tag，如 v0.2.0 / nightly-97（publish 勾上时必填）
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 手动触发的那次不取消：可能正在发版
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  # build_ui.py / build_live2d.py 是构建的一部分，别让 Python 写 __pycache__
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  # ------------------------------------------------------------------- Gate ---
  # GitHub 的 on.push 不能按 commit 消息过滤，所以先开一道闸：
  # 手动触发一律放行；push 时只有首行含 "release" 才放行，否则后面三个 job 全跳过。
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Check the trigger
        id: check
        env:
          EVENT: ${{ github.event_name }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "手动触发 —— 继续构建"
            exit 0
          fi
          first=$(printf '%s' "$MSG" | head -n 1)
          if printf '%s' "$first" | grep -qi 'release'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "提交信息命中 release —— 继续构建：$first"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "提交信息不含 release —— 跳过构建：$first"
          fi

  # ---------------------------------------------------------------- Windows ---
  windows:
    name: Windows (MSYS2 UCRT64)
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libsodium
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-python

      - name: Configure
        run: |
          # <generator> 是硬依赖：MSYS2 现在的 gcc 15/16 都有，探一下留个凭据
          if ! printf '#include <generator>\n#include <expected>\nint main(){}\n' \
               | g++ -std=c++26 -x c++ -fsyntax-only - >/dev/null 2>&1; then
            echo "::error::$(g++ --version | head -1) 编不了 <generator>（要 GCC >= 14）"
            exit 1
          fi
          echo "compiler: $(g++ --version | head -1)"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAGENT_CXX_STANDARD=26

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke (--help)
        run: ./build/agent.exe --help

      - name: Report artifact
        run: |
          ls -lh build/agent.exe
          file build/agent.exe || true

      - uses: actions/upload-artifact@v4
        with:
          name: agent-windows-x64
          path: build/agent.exe
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux ---
  linux:
    name: Linux (GCC, GTK3 + WebKitGTK)
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential g++-14 \
            cmake ninja-build pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libcurl4-openssl-dev libssl-dev libsodium-dev \
            libboost-dev nlohmann-json3-dev

      - name: Configure
        run: |
          # 24.04 自带的 gcc-13 没有 <generator>（libstdc++ 14 才有），所以固定用 g++-14
          cxx=g++-14
          command -v $cxx >/dev/null || { echo "::error::g++-14 没装上"; exit 1; }
          if ! printf '#include <generator>\n#include <expected>\nint main(){}\n' \
               | $cxx -std=c++26 -x c++ -fsyntax-only - >/dev/null 2>&1; then
            echo "::error::$($cxx --version | head -1) 编不了 <generator>（要 GCC >= 14）"
            exit 1
          fi
          echo "compiler: $($cxx --version | head -1)"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=$cxx \
            -DAGENT_CXX_STANDARD=26

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke (--help)
        run: ./build/agent --help

      - name: Report artifact
        run: |
          ls -lh build/agent
          file build/agent
          ldd build/agent | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: agent-linux-x64
          path: build/agent
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS ---
  macos:
    name: macOS (Apple clang, arm64)
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 失败的那次用的是 macos-14 自带的 Xcode（libc++ 18），没有 <generator>。
      # 先换最新的 Xcode；如果镜像里最新的也不够新，再退到 brew 的 llvm。
      - name: Use the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # brew 的 include 目录不在 clang 默认搜索路径里：CMakeLists 是靠
      # find_path(boost/asio.hpp) 找到 /opt/homebrew/include 的，所以 boost 必须装
      - name: Install dependencies
        run: brew install ninja libsodium boost nlohmann-json

      # 注意：`brew install llvm` 的 clang++ 默认**不会**用它自己那份 libc++ ——
      # llvm 是 keg-only，libc++ 头文件在 $LLVM/include/c++/v1、库在 $LLVM/lib/c++，
      # 都不在 clang 的默认搜索路径里，于是它照样去读 SDK 那份 libc++，等于白装。
      # 要真用上必须显式 -nostdinc++ + -isystem，链接侧再补 -L lib/c++ 和 -lunwind。
      - name: Pick a compiler that has <generator>
        id: cc
        run: |
          set -uo pipefail

          # 成功返回 0；失败时把编译器原话留在 /tmp/probe.log（别再 >/dev/null 吞掉，
          # 上一版就是吞掉了才只能靠猜「libc++ 太旧」）。
          probe() {
            local cxx="$1"; shift
            printf '#include <generator>\n#include <expected>\n#include <format>\nint main(){}\n' \
              | "$cxx" -std=c++26 -x c++ -fsyntax-only "$@" - >/tmp/probe.log 2>&1
          }
          dump() {
            echo "---- $1 的原话 ----"
            sed -e 's/^/  | /' /tmp/probe.log | head -20
            echo "-------------------"
          }

          cxx=""; cxxflags=""; ldflags=""

          echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
          xcxx="$(xcrun -f clang++)"
          echo "default: $($xcxx --version | head -1)"
          if probe "$xcxx"; then
            echo "使用 Xcode 的 clang++"
            cxx="$xcxx"
          else
            dump "Xcode 的 clang++"
            echo "Xcode 这份 libc++ 不行（<generator> 要 Xcode >= 16.3），改用 brew llvm"
            brew install llvm
            llvm="$(brew --prefix llvm)"
            cxx="$llvm/bin/clang++"
            # -nostdinc++ 之后必须自己把 libc++ 头目录补回去，否则 C++ 头一个都找不到。
            cxxflags="-nostdinc++ -isystem $llvm/include/c++/v1 -D_LIBCPP_DISABLE_AVAILABILITY"
            # brew 把 libc++/libc++abi 装在 lib/c++、libunwind 装在 lib/unwind；
            # rpath 是给 Smoke 那一步用的（否则 @rpath/libc++.1.dylib 找不到）。
            ldflags="-L$llvm/lib/c++ -L$llvm/lib/unwind -lunwind"
            ldflags="$ldflags -Wl,-rpath,$llvm/lib/c++ -Wl,-rpath,$llvm/lib/unwind"
            echo "brew llvm: $($cxx --version | head -1)"
            echo "cxxflags: $cxxflags"
            if ! probe "$cxx" $cxxflags; then
              dump "brew llvm"
              echo "::error::brew llvm 也编不了 <generator>：$($cxx --version | head -1)"
              exit 1
            fi
            # 探针过了还得确认拿的真是 brew 那份头文件，不是又绕回 SDK 去了
            inc=$(printf '#include <generator>\n' \
                  | "$cxx" $cxxflags -std=c++26 -x c++ -E -v - 2>&1 >/dev/null \
                  | sed -n '/#include <...> search starts here:/,/End of search list/p' \
                  | grep -m1 'c++/v1')
            echo "libc++ headers: $inc"
            if [ -n "$inc" ]; then
              case "$inc" in
                *"$llvm"*) ;;
                *) echo "::error::还在用 $inc，不是 brew llvm 的 libc++"; exit 1 ;;
              esac
            else
              echo "::warning::没解析出 libc++ 头搜索路径，跳过这项自检"
            fi
          fi

          {
            echo "cxx=$cxx"
            echo "cxxflags=$cxxflags"
            echo "ldflags=$ldflags"
          } >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="${{ steps.cc.outputs.cxx }}" \
            -DCMAKE_CXX_FLAGS="${{ steps.cc.outputs.cxxflags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ steps.cc.outputs.ldflags }}" \
            -DAGENT_CXX_STANDARD=26

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke (--help)
        run: ./build/agent --help

      - name: Report artifact
        run: |
          ls -lh build/agent
          file build/agent
          otool -L build/agent

      - uses: actions/upload-artifact@v4
        with:
          name: agent-macos-arm64
          path: build/agent
          if-no-files-found: error

  # ---------------------------------------------------------------- Release ---
  # 只有手动触发且勾了 publish 才发版：push 里写 release 只负责「构建」，
  # 版本号/tag 得人来定，别让一条 commit 消息自动占掉 tag。
  release:
    name: Release
    if: ${{ inputs.publish && needs.gate.outputs.build == 'true' }}
    needs: [gate, windows, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::勾了 publish 但没填 tag"
            exit 1
          fi
          echo "release tag: $TAG"

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package
        run: |
          set -euo pipefail
          cd dist
          for d in agent-*/; do
            d=${d%/}
            case "$d" in
              agent-windows-*) (cd "$d" && zip -q -r "../$d.zip" .) ;;
              *)               tar -czf "$d.tar.gz" -C "$d" . ;;
            esac
            rm -rf "$d"
          done
          sha256sum ./* > SHA256SUMS.txt
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*
          prerelease: ${{ contains(inputs.tag, 'nightly') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
