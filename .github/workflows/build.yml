name: build

# 多平台 CMake 构建：Windows (MSYS2 UCRT64) / Linux (GCC) / macOS (Apple clang)。
#
# 触发条件（只有这两个）：
#   1. push 到 main / master，且这次 push 的最新一条 commit 消息里含 "release"
#      （不区分大小写，只看首行：`release` / `release: v0.2` / `Release 0.2` 都算）；
#      不含就整条流水线跳过，只留一个 gate job 记一笔。
#   2. 手动 workflow_dispatch。
# 两条路都是**构建成功就发 Release**（和 cell-app 一致）：tag 默认取 UTC 时间戳
# （v2026.10.27-1035），手动触发时可以用 tag 输入覆盖成正式版本号。
#
# 关于 C++ 标准：cell.cpp 无条件 include <generator> / <expected> / <format>，还用
# std::move_only_function。#embed 要 GCC >= 15 / Clang >= 19，拿不到时 build_live2d.py
# 会把 kAssetCount 置 0（exe 不带默认 Live2D 模型）。
# 注意 macOS：libc++（含 Apple 那份）既没有 <generator> 也没有 std::move_only_function，
# 由 CMakeLists.txt 的 check_include_file_cxx 挂上 third_party/compat 补（过渡性，
# 等 macOS 官方支持后这段自动失效）。CI 只负责挑一个能编 C++26 的 clang。

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      tag:
        description: 发布用的 tag；留空则自动用 UTC 时间戳（如 v2026.10.27-1035）
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 手动触发的那次不取消：可能正在发版
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  # build_ui.py / build_live2d.py 是构建的一部分，别让 Python 写 __pycache__
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  # ------------------------------------------------------------------- Gate ---
  # GitHub 的 on.push 不能按 commit 消息过滤，所以先开一道闸：
  # 手动触发一律放行；push 时只有首行含 "release" 才放行，否则后面三个 job 全跳过。
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Check the trigger
        id: check
        env:
          EVENT: ${{ github.event_name }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "手动触发 —— 继续构建"
            exit 0
          fi
          first=$(printf '%s' "$MSG" | head -n 1)
          if printf '%s' "$first" | grep -qi 'release'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "提交信息命中 release —— 继续构建：$first"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "提交信息不含 release —— 跳过构建：$first"
          fi

  # ---------------------------------------------------------------- Windows ---
  windows:
    name: Windows (MSYS2 UCRT64)
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libsodium
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-python

      - name: Configure
        run: |
          # <generator> 是硬依赖：MSYS2 现在的 gcc 15/16 都有，探一下留个凭据
          if ! printf '#include <generator>\n#include <expected>\nint main(){}\n' \
               | g++ -std=c++26 -x c++ -fsyntax-only - >/dev/null 2>&1; then
            echo "::error::$(g++ --version | head -1) 编不了 <generator>（要 GCC >= 14）"
            exit 1
          fi
          echo "compiler: $(g++ --version | head -1)"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAGENT_CXX_STANDARD=26

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke (--help)
        run: ./build/agent.exe --help

      - name: Report artifact
        run: |
          ls -lh build/agent.exe
          file build/agent.exe || true

      - uses: actions/upload-artifact@v4
        with:
          name: agent-windows-x64
          path: build/agent.exe
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux ---
  linux:
    name: Linux (GCC, GTK3 + WebKitGTK)
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential g++-14 \
            cmake ninja-build pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libcurl4-openssl-dev libssl-dev libsodium-dev \
            libboost-dev nlohmann-json3-dev

      - name: Configure
        run: |
          # 24.04 自带的 gcc-13 没有 <generator>（libstdc++ 14 才有），所以固定用 g++-14
          cxx=g++-14
          command -v $cxx >/dev/null || { echo "::error::g++-14 没装上"; exit 1; }
          if ! printf '#include <generator>\n#include <expected>\nint main(){}\n' \
               | $cxx -std=c++26 -x c++ -fsyntax-only - >/dev/null 2>&1; then
            echo "::error::$($cxx --version | head -1) 编不了 <generator>（要 GCC >= 14）"
            exit 1
          fi
          echo "compiler: $($cxx --version | head -1)"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=$cxx \
            -DAGENT_CXX_STANDARD=26

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke (--help)
        run: ./build/agent --help

      - name: Report artifact
        run: |
          ls -lh build/agent
          file build/agent
          ldd build/agent | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: agent-linux-x64
          path: build/agent
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS ---
  macos:
    name: macOS (Apple clang, arm64)
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 失败的那次用的是 macos-14 自带的 Xcode（libc++ 18），没有 <generator>。
      # 先换最新的 Xcode；如果镜像里最新的也不够新，再退到 brew 的 llvm。
      - name: Use the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # brew 的 include 目录不在 clang 默认搜索路径里：CMakeLists 是靠
      # find_path(boost/asio.hpp) 找到 /opt/homebrew/include 的，所以 boost 必须装
      - name: Install dependencies
        run: brew install ninja libsodium boost nlohmann-json

      # <generator> / std::move_only_function 不在这里管：libc++ 两个都没有，由
      # CMakeLists.txt 的 check_include_file_cxx 挂上 third_party/compat（compat 里的
      # 头用 #include_next 转发，有真实现就自动让位）。这里只负责挑一个能编 C++26 的
      # clang —— 镜像里的 Xcode 26.6（clang 21）就够，brew llvm 只是兜底。
      - name: Pick a C++26 compiler
        id: cc
        run: bash .github/scripts/pick-macos-cxx.sh

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="${{ steps.cc.outputs.cxx }}" \
            -DAGENT_CXX_STANDARD=26

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke (--help)
        run: ./build/agent --help

      - name: Report artifact
        run: |
          ls -lh build/agent
          file build/agent
          otool -L build/agent

      - uses: actions/upload-artifact@v4
        with:
          name: agent-macos-arm64
          path: build/agent
          if-no-files-found: error

  # ---------------------------------------------------------------- Release ---
  # 构建成功就发版，不再问「要不要发」：tag 默认取 UTC 时间戳
  # （v2026.10.27-1035，和 cell-app 一致），手动 dispatch 时可以用 tag 输入覆盖。
  # 附件只有三个可执行文件（不打包、不发校验和文件），发行说明由下面那步生成。
  #
  # 为什么不再有 publish 开关：push 触发的运行里 inputs 是空的，那个开关会让
  # release job 静默跳过（UI 上只显示 "This job was skipped"），很难看出来。
  release:
    name: Release
    if: needs.gate.outputs.build == 'true'
    needs: [gate, windows, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # 时间戳 tag 落在构建那次提交上（--target），不是默认分支的 HEAD
      - name: Work out the tag
        id: tag
        env:
          OVERRIDE: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${OVERRIDE:-}"
          if [ -z "$tag" ]; then
            tag="v$(date -u +%Y.%m.%d)-$(date -u +%H%M)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: $tag"

      - uses: actions/download-artifact@v4
        with:
          path: dist

      # 只发可执行文件：三个平台各一个，不再打 zip/tar。GitHub 会自动附上
      # "Source code (zip / tar.gz)"，那两个去不掉，也不该由我们负责。
      - name: Collect the binaries
        run: |
          set -euo pipefail
          mkdir -p out
          cp dist/agent-windows-x64/agent.exe out/agent-windows-x64.exe
          cp dist/agent-linux-x64/agent       out/agent-linux-x64
          cp dist/agent-macos-arm64/agent     out/agent-macos-arm64
          chmod +x out/agent-linux-x64 out/agent-macos-arm64   # artifact 上传会丢掉执行位
          ls -lh out

      # 发行说明自己写：构建时间（北京时间 + UTC）、提交、流水线链接，
      # 每个文件的大小与 SHA-256，以及一句用法。校验和放在正文里，不额外发文件。
      - name: Write the release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          bj="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          utc="$(date -u '+%Y-%m-%d %H:%M:%S')"
          sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          row() { # row <文件> <平台>
            [ -f "$1" ] || { echo "::error::缺少 $1（构建产物没下载到）" >&2; exit 1; }
            printf '| %s | `%s` | %s | `%s` |\n' \
              "$2" "$(basename "$1")" \
              "$(du -h "$1" | cut -f1 | tr -d ' ')" \
              "$(sha256sum "$1" | cut -d' ' -f1)"
          }

          {
            echo "## agent.cpp \`${TAG}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| 构建时间 | ${bj}（北京时间） · ${utc} UTC |"
            echo "| 提交 | [\`${sha}\`](${commit_url}) |"
            echo "| 分支 | \`${GITHUB_REF_NAME}\` |"
            echo "| 流水线 | [#${GITHUB_RUN_NUMBER}](${run_url}) |"
            echo
            echo "### 下载"
            echo
            echo "| 平台 | 文件 | 大小 | SHA-256 |"
            echo "|---|---|---|---|"
            row out/agent-windows-x64.exe "Windows x64"
            row out/agent-linux-x64 "Linux x64"
            row out/agent-macos-arm64 "macOS arm64"
            echo
            echo "### 用法"
            echo
            echo '```sh'
            echo "chmod +x agent-linux-x64   && ./agent-linux-x64"
            echo "chmod +x agent-macos-arm64 && ./agent-macos-arm64"
            echo '```'
            echo
            echo "Windows 直接运行 \`agent-windows-x64.exe\`。"
            echo
            echo "> Linux 侧需要 GTK3 + WebKitGTK；macOS 的二进制未签名、未公证，"
            echo "> 首次运行可能要在「系统设置 → 隐私与安全性」里放行。"
          } > release-notes.md
          cat release-notes.md

      # gh 自带在 runner 上；--target 把 tag 钉在构建的那次提交上，
      # 重跑时 tag 已存在就 --clobber 覆盖资产，不会 422。
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* \
              --target "$GITHUB_SHA" \
              --title "agent.cpp $TAG" \
              --notes-file release-notes.md
          fi
