<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>agent</title>
<link rel="icon" href="@asset(assets/favicon.png)">
<style>/*@css*/</style>
</head>
<body>
<div id="app">

  <!-- ================= 全屏舞台 =================
       Live2D 不再是右栏里的一个小方块，而是铺满整个窗口的背景层：
       界面浮在上面（字幕、输入、角色栏），模型在下面演。
       舞台层是 fixed + z-index:0，所以它不参与 #app 的栅格。 -->
  <div id="stage-frame">
    <div class="stage-glow" id="stage-glow"></div>
    <div class="l2d-wrap idle" id="l2d-wrap">
      <canvas id="l2d-canvas"></canvas>
      <button class="l2d-status" id="l2d-status">Live2D 还没就绪 · 点这里接入</button>
    </div>
    <!-- 压暗层：底部给字幕让位，四周收一圈暗角 -->
    <div class="stage-veil"></div>
  </div>

  <!-- ================= 左侧角色栏 =================
       可收纳：收起来只剩一条窄边，箭头反转，点一下再展开（状态在 localStorage）。 -->
  <aside id="rail">
    <button class="rail-toggle" id="btn-rail" title="收起侧边栏">
      <svg viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"/></svg>
    </button>
    <div class="rail-mark" title="agent">
      <img class="rail-logo" src="@asset(assets/ui-logo.png)" alt="agent">
    </div>
    <div class="rail-list" id="persona-list"></div>
    <button class="rail-btn" id="btn-new-persona" title="新建角色">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="rail-gap"></div>
    <button class="rail-btn" id="btn-memory" title="记忆">
      <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.3-7-9.2A3.8 3.8 0 0 1 12 8a3.8 3.8 0 0 1 7 2.8C19 15.7 12 20 12 20Z"/></svg>
    </button>
    <button class="rail-btn" id="btn-settings" title="设置">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.4 1Z"/></svg>
    </button>
  </aside>

  <!-- ================= 中间：字幕轨 ================= -->
  <main id="chat">
    <header id="chat-head">
      <div class="head-id">
        <div class="head-line">
          <span id="stage-name">—</span>
          <span class="head-status" id="head-status">连接中</span>
          <div class="voice-bars" id="voice-bars"><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="head-sub" id="stage-sub"></div>
      </div>
      <div class="head-tools">
        <div class="stage-mood"><span class="dot" id="mood-dot"></span><span id="mood-text">平静</span></div>
        <button class="ico-btn" id="btn-stage" title="Live2D 与触发器">
          <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h12M20 17h0"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="17" r="2"/></svg>
        </button>
        <button class="ico-btn" id="btn-sessions" title="会话记录">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        </button>
        <button class="ico-btn" id="btn-tools" title="工具调用记录">
          <svg viewBox="0 0 24 24"><path d="m4 7 4 5-4 5"/><path d="M12.5 17H20"/></svg>
        </button>
        <button class="ico-btn" id="btn-voice" title="朗读回复">
          <svg viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/></svg>
        </button>
        <button class="ico-btn" id="btn-clear-context" title="清空上下文">
          <svg viewBox="0 0 24 24"><path d="m13.5 10.5 8-8"/><path d="M15 12.2c.8.8.9 2 .2 2.9L10.5 21l-7.5-7.5 5.7-4.9c.9-.7 2.1-.6 2.9.2Z"/><path d="m7.4 10.3 6.3 6.3"/><path d="m4.6 17.6 1.6-1.6"/></svg>
        </button>
      </div>
    </header>

    <!-- 字幕轨：从下往上堆，越旧的越淡；拖动滚轮可以回看历史 -->
    <section id="subs">
      <div class="stage-bubble" id="stage-bubble"></div>
      <div class="stage-act" id="stage-act"></div>
      <div id="stream" aria-live="polite"></div>

      <div id="typing" class="typing hidden">
        <span class="tdot"></span><span class="tdot"></span><span class="tdot"></span>
        <span id="typing-label">正在想</span>
      </div>

      <!-- 舞台状态条：主动关怀 / 角色设定 / 记忆 -->
      <div class="stage-stats">
        <button class="stat" id="btn-proactive">
          <span class="stat-k">主动关怀</span>
          <span class="stat-v" id="proactive-v">关</span>
        </button>
        <button class="stat" id="btn-edit-persona">
          <span class="stat-k">角色设定</span>
          <span class="stat-v">编辑</span>
        </button>
        <span class="stage-mem" id="stage-mem">记忆 0 条</span>
      </div>
    </section>

    <footer id="composer">
      <!-- 附件托盘：图片显示缩略图，其它显示文件 chip，每个都能删 -->
      <div id="attach-tray" class="hidden"></div>
      <div class="composer-box">
        <button class="attach-btn" id="btn-attach" title="添加图片或文件（也可以拖进来 / 粘贴）">
          <svg viewBox="0 0 24 24"><path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l8.9-8.9a4 4 0 0 1 5.7 5.7l-8.9 8.9a2 2 0 0 1-2.8-2.8l8.2-8.2"/></svg>
        </button>
        <button class="mic-btn" id="btn-mic" title="点击开始 / 结束录音（Ctrl+Shift+M）">
          <span class="mic-lvl"></span>
          <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="10.5" rx="3"/><path d="M5.5 12.5a6.5 6.5 0 0 0 13 0M12 19v3"/></svg>
          <span class="mic-ring"></span>
        </button>
        <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="think-btn" id="btn-think" title="思考强度">
          <svg viewBox="0 0 24 24"><path d="M9.5 18h5M10.5 21h3"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.4.3.6.8.6 1.3V17h6v-1.9c0-.5.2-1 .6-1.3A6 6 0 0 0 12 3Z"/></svg>
          <span class="think-lv" id="think-lv">关</span>
        </button>
        <button class="send-btn" id="btn-send" title="发送">
          <svg viewBox="0 0 24 24" class="i-send"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          <svg viewBox="0 0 24 24" class="i-stop"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
        </button>
      </div>
      <div class="composer-hint" id="composer-hint"></div>
    </footer>

    <!-- 拖拽文件进对话区时的提示（拖动中才显示） -->
    <div id="drop-overlay">
      <div class="drop-card">
        <svg viewBox="0 0 24 24"><path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l8.9-8.9a4 4 0 0 1 5.7 5.7l-8.9 8.9a2 2 0 0 1-2.8-2.8l8.2-8.2"/></svg>
        <span>松开，作为附件发给她</span>
      </div>
    </div>
  </main>
</div>

<!-- ================= 抽屉：设置 / 记忆 / 角色编辑 / 会话 ================= -->
<div id="scrim" class="hidden"></div>
<section id="drawer" class="hidden" aria-modal="true">
  <header class="drawer-head">
    <div id="drawer-title">设置</div>
    <button class="ico-btn" id="btn-drawer-close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </header>
  <div class="drawer-body" id="drawer-body"></div>
  <!-- 抽屉自己的底栏：需要常驻的保存条挂在这里（不再用滚动内容里的 sticky，
       那样会浮在内容上面、压住最后几行） -->
  <div class="drawer-foot hidden" id="drawer-foot"></div>
</section>

<!-- 图片全屏预览：Esc 或点背景关闭（逻辑在 12-attach.js） -->
<div id="lightbox" class="hidden" role="dialog" aria-modal="true" aria-label="图片预览">
  <button class="lightbox-close" id="lightbox-close" title="关闭">
    <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <img id="lightbox-img" alt="">
</div>

<div id="toasts"></div>
<input type="file" id="avatar-file" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden">
<input type="file" id="audio-file" accept="audio/*" class="hidden">
<!-- 输入框附件 / 表情包上传：真正的读取在 12-attach.js 与 05-settings.js -->
<input type="file" id="attach-file" multiple class="hidden">
<input type="file" id="sticker-file" accept="image/png,image/jpeg,image/gif,image/webp" multiple class="hidden">

<!-- ================= 头像截取 ================= -->
<div id="crop-modal" class="hidden">
  <div class="crop-card">
    <div class="crop-head">截取头像</div>
    <div class="crop-stage" id="crop-stage">
      <canvas id="crop-canvas"></canvas>
      <div class="crop-ring"></div>
    </div>
    <div class="crop-zoom-row">
      <span class="crop-zoom-ico">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.6-4.6M11 8.5v5M8.5 11h5"/></svg>
      </span>
      <input type="range" id="crop-zoom" min="0" max="100" step="1" value="0" aria-label="缩放">
    </div>
    <div class="crop-tip">拖动调整位置 · 滚轮或滑块缩放 · 圆形区域为最终头像</div>
    <div class="crop-actions">
      <button class="btn ghost" id="crop-cancel">取消</button>
      <button class="btn primary" id="crop-ok">使用这张</button>
    </div>
  </div>
</div>

<!-- ================= 确认弹窗（清空上下文这类不可撤销的动作） ================= -->
<div id="ask-modal" class="hidden">
  <div class="ask-card" role="dialog" aria-modal="true" aria-labelledby="ask-title">
    <div class="ask-head" id="ask-title">确认</div>
    <div class="ask-text" id="ask-text"></div>
    <div class="ask-note hidden" id="ask-note"></div>
    <div class="ask-actions" id="ask-actions"></div>
  </div>
</div>

<script>/*@js*/</script>
</body>
</html>
