<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Loading</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://image.uc.cn/s/uae/g/3n/mos-production/fontawesome-free-7.1.0-web/js/all.min.js"></script>
  <link href="https://image.uc.cn/s/uae/g/3n/mos-production/fontawesome-free-7.1.0-web/css/fontawesome.min.css"
    rel="stylesheet" />
  <script src="https://image.uc.cn/s/uae/g/3n/mos-production/cdn-staticfile-net/axios/1.6.7/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@exuanbo/file-icons-js/dist/file-icons-js.min.js"></script>
  <style>
    :root {
      --bg-base: #09090b;
      --bg-panel: #121214;
      --bg-surface: #18181b;
      --border-color: #27272a;
      --border-hover: #3f3f46;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #e4e4e7;
      --text-muted: #a1a1aa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-base);
      color: var(--text-main);
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 8px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-hover);
    }

    /* 布局 */
    #app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #sidebar {
      width: 192px;
      flex-shrink: 0;
      background: #09090b;
      border-right: 1px solid #27272a;
      display: flex;
      flex-direction: column;
      z-index: 20;
    }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #09090b;
      position: relative;
    }

    /* 通用侧边覆盖层 */
    .side-overlay {
      position: fixed;
      right: 0;
      top: 0;
      width: 380px;
      height: 100vh;
      background: #121214;
      border-left: 1px solid #27272a;
      z-index: 50;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -8px 0 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
    }

    .side-overlay.open {
      transform: translateX(0);
    }

    #overlay-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 49;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    #overlay-backdrop.show {
      opacity: 1;
      pointer-events: all;
    }

    /* 侧边栏 */
    .sidebar-header {
      padding: 12px;
      border-bottom: 1px solid #27272a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #a1a1aa;
      margin: 0;
    }

    .sidebar-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: #a1a1aa;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }

    .sidebar-btn:hover {
      background: #27272a;
      color: #e4e4e7;
    }

    #session-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .session-item {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 2px;
      font-size: 13px;
      color: #a1a1aa;
      border: 1px solid transparent;
      transition: all 0.15s;
      gap: 6px;
    }

    .session-item:hover {
      background: #18181b;
      color: #d4d4d8;
    }

    .session-item.active {
      background: rgba(99, 102, 241, 0.1);
      border-color: rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
    }

    .session-item .sess-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .session-item .del-btn {
      opacity: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      border: none;
      background: transparent;
      color: #71717a;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .session-item:hover .del-btn {
      opacity: 1;
    }

    .session-item .del-btn:hover {
      background: rgba(244, 63, 94, 0.15);
      color: #f87171;
    }

    .sidebar-footer {
      padding: 10px 12px;
      border-top: 1px solid #27272a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
    }

    /* 主聊天区 */
    .chat-header {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(18, 18, 20, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #27272a;
      flex-shrink: 0;
      z-index: 10;
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .model-selector {
      position: relative;
    }

    .model-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 6px;
      background: transparent;
      border: 1px solid transparent;
      color: #d4d4d8;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .model-btn:hover {
      background: #27272a;
      border-color: #3f3f46;
    }

    .model-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .model-dropdown {
      position: absolute;
      left: 0;
      top: 100%;
      margin-top: 4px;
      width: 240px;
      max-height: 260px;
      overflow-y: auto;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      z-index: 60;
      display: none;
    }

    .model-dropdown.show {
      display: block;
    }

    .model-opt {
      width: 100%;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #d4d4d8;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.1s;
      text-align: left;
    }

    .model-opt:hover {
      background: #27272a;
    }

    .chat-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: #71717a;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.15s;
    }

    .icon-btn:hover {
      background: #27272a;
      color: #d4d4d8;
    }

    .icon-btn.purple:hover {
      color: #c084fc;
    }

    .icon-btn.red:hover {
      color: #f87171;
    }

    .session-id-badge {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: #71717a;
      background: rgba(39, 39, 42, 0.5);
      padding: 4px 8px;
      border-radius: 5px;
      border: 1px solid #27272a;
    }

    /* 消息区域 */
    #messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      scroll-behavior: smooth;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #52525b;
    }

    .empty-state i {
      font-size: 48px;
      margin-bottom: 16px;
      display: block;
      opacity: 0.3;
    }

    /* 消息气泡 */
    .msg-row {
      display: flex;
      margin-bottom: 20px;
      gap: 10px;
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-row.ai {
      justify-content: flex-start;
    }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      align-self: flex-end;
    }

    .msg-avatar.user-av {
      background: #4f46e5;
      color: #fff;
    }

    .msg-avatar.ai-av {
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #d4d4d8;
    }

    .msg-bubble {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.65;
      word-wrap: break-word;
      position: relative;
    }

    .msg-bubble.user-bub {
      background: rgba(79, 70, 229, 0.06);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #e4e4e7;
      border-radius: 10px;
    }

    .msg-bubble.ai-bub {
      color: #d4d4d8;
      max-width: 85%;
      padding: 0;
      background: transparent;
      border: none;
      border-radius: 0;
    }

    /* 思考过程 */
    .think-block {
      margin-top: 8px;
      margin-bottom: 8px;
      background: rgba(139, 92, 246, 0.06);
      border-left: 3px solid #8b5cf6;
      border-radius: 0 8px 8px 0;
      overflow: hidden;
    }

    .think-block summary {
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 500;
      color: #c4b5fd;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
      list-style: none;
    }

    .think-block summary::-webkit-details-marker {
      display: none;
    }

    .think-block summary:hover {
      background: rgba(139, 92, 246, 0.08);
    }

    .think-block summary i {
      font-size: 10px;
      transition: transform 0.2s;
    }

    .think-block[open] summary i {
      transform: rotate(90deg);
    }

    .think-content {
      padding: 8px 16px 12px 16px;
      font-size: 12.5px;
      color: #a1a1aa;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    /* 工具调用 */
    .tool-call {
      margin: 6px 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #27272a;
    }

    .tool-call summary {
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.05);
      list-style: none;
    }

    .tool-call summary::-webkit-details-marker {
      display: none;
    }

    .tool-call summary .tool-icon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
    }

    .tool-call summary .tool-name {
      font-weight: 500;
      color: #fbbf24;
    }

    .tool-call summary .tool-args {
      color: #a1a1aa;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .tool-call summary .tool-status {
      font-size: 11px;
      margin-left: auto;
    }

    .tool-call summary .tool-status.ok {
      color: #4ade80;
    }

    .tool-call summary .tool-status.err {
      color: #f87171;
    }

    .tool-output {
      padding: 10px 14px;
      background: #0c0c0e;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      white-space: pre-wrap;
      color: #a1a1aa;
      max-height: 300px;
      overflow-y: auto;
      line-height: 1.5;
      border-top: 1px solid #1f1f22;
    }

    /* 打字光标 */
    .typing-cursor::after {
      content: "▋";
      animation: blink 1s step-end infinite;
      margin-left: 2px;
      color: #6366f1;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    /* Markdown 样式 */
    .msg-bubble.ai-bub p {
      margin: 0.5em 0;
    }

    .msg-bubble.ai-bub p:first-child {
      margin-top: 0;
    }

    .msg-bubble.ai-bub p:last-child {
      margin-bottom: 0;
    }

    .msg-bubble.ai-bub pre {
      background: #0c0c0e;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 14px;
      overflow-x: auto;
      margin: 10px 0;
      position: relative;
      font-size: 12.5px;
    }

    .msg-bubble.ai-bub code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85em;
      color: #fca5a5;
      background: rgba(252, 165, 165, 0.08);
      padding: 2px 5px;
      border-radius: 4px;
    }

    .msg-bubble.ai-bub pre code {
      background: none;
      padding: 0;
      color: #d4d4d8;
    }

    .msg-bubble.ai-bub blockquote {
      border-left: 3px solid #6366f1;
      padding: 6px 14px;
      margin: 10px 0;
      color: #a1a1aa;
      background: rgba(99, 102, 241, 0.05);
      border-radius: 0 6px 6px 0;
      font-style: italic;
    }

    .msg-bubble.ai-bub a {
      color: #818cf8;
      text-decoration: none;
    }

    .msg-bubble.ai-bub ul,
    .msg-bubble.ai-bub ol {
      padding-left: 20px;
      margin: 6px 0;
    }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 4px 8px;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 5px;
      color: #a1a1aa;
      font-size: 10px;
      cursor: pointer;
      opacity: 0;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .msg-bubble.ai-bub pre:hover .copy-btn {
      opacity: 1;
    }

    .copy-btn:hover {
      background: #3f3f46;
      color: #fff;
    }

    /* 图片 */
    .msg-images {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #27272a;
    }

    .msg-images img {
      max-width: 260px;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #3f3f46;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .msg-images img:hover {
      transform: scale(1.02);
    }

    /* 系统输出折叠块 */
    .sys-output-block {
      margin: 8px 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #27272a;
      background: #0c0c0e;
    }
    .sys-output-block summary {
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.04);
      list-style: none;
    }
    .sys-output-block summary::-webkit-details-marker {
      display: none;
    }
    .sys-output-block summary i.fa-chevron-right {
      transition: transform 0.2s;
    }
    .sys-output-block[open] summary i.fa-chevron-right {
      transform: rotate(90deg);
    }
    .sys-output-block .sysout-inner {
      padding: 0;
      border-top: 1px solid #1f1f22;
    }
    .sys-output-block .sysout-inner pre {
      margin: 0;
      border: none;
      border-radius: 0;
      background: #0c0c0e;
    }
    .sysout-status.ok { color: #4ade80; }
    .sysout-status.err { color: #f87171; }

    /* 加载覆盖层 */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(9, 9, 11, 0.75);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      cursor: not-allowed;
    }
    #loading-overlay.active {
      display: flex;
    }
    .loading-spinner {
      text-align: center;
    }
    .loading-spinner i {
      font-size: 48px;
      color: #6366f1;
    }
    .loading-spinner .loading-text {
      margin-top: 16px;
      color: #a1a1aa;
      font-size: 14px;
    }
    .loading-spinner .loading-sub {
      margin-top: 6px;
      color: #52525b;
      font-size: 12px;
    }

    /* 滚动到底部按钮 */
    #scroll-bottom-btn {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      padding: 8px 16px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 20px;
      color: #a1a1aa;
      font-size: 12px;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      transition: all 0.2s;
    }
    #scroll-bottom-btn:hover {
      background: #27272a;
      color: #e4e4e7;
    }
    #scroll-bottom-btn.show {
      display: flex;
    }

    .usage-footer {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #27272a;
      display: flex;
      gap: 14px;
      font-size: 11px;
      color: #52525b;
      font-family: 'JetBrains Mono', monospace;
    }

    /* 输入区 */
    .input-area {
      padding: 6px 16px 12px;
      flex-shrink: 0;
    }

    .input-wrapper {
      max-width: 900px;
      margin: 0 auto;
    }

    .input-box {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      transition: border-color 0.2s;
    }

    .input-box:focus-within {
      border-color: #6366f1;
      box-shadow: 0 4px 24px rgba(99, 102, 241, 0.15);
    }

    #image-preview-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 12px 0;
    }

    #image-preview-container:empty {
      display: none;
    }

    .img-preview {
      position: relative;
    }

    .img-preview img {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #3f3f46;
    }

    .img-preview .rm-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f43f5e;
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 9px;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .img-preview:hover .rm-btn {
      display: flex;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      padding: 8px 10px;
      gap: 6px;
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #e4e4e7;
      resize: none;
      font-size: 14px;
      line-height: 1.5;
      outline: none;
      max-height: 200px;
      min-height: 24px;
      font-family: inherit;
    }

    #send-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #6366f1;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.3);
    }

    #send-btn:hover {
      background: #4f46e5;
      transform: scale(1.05);
    }

    #send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .attach-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: #71717a;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.15s;
    }

    .attach-btn:hover {
      background: #27272a;
      color: #a1a1aa;
    }

    .input-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding: 0 4px;
    }

    .think-toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #71717a;
      cursor: pointer;
    }

    .think-toggle-row input {
      display: none;
    }

    .toggle-track {
      width: 32px;
      height: 18px;
      background: #3f3f46;
      border-radius: 9px;
      position: relative;
      transition: background 0.2s;
    }

    .toggle-track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .think-toggle-row input:checked+.toggle-track {
      background: #6366f1;
    }

    .think-toggle-row input:checked+.toggle-track::after {
      transform: translateX(14px);
    }

    /* 设置覆盖层 */
    .overlay-header {
      padding: 14px 16px;
      border-bottom: 1px solid #27272a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .overlay-header h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #d4d4d8;
      margin: 0;
    }

    .overlay-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
    }

    .overlay-tabs {
      display: flex;
      border-bottom: 1px solid #27272a;
      margin-bottom: 14px;
    }

    .overlay-tab {
      flex: 1;
      padding: 9px 4px;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #71717a;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }

    .overlay-tab.active {
      color: #a5b4fc;
      border-bottom-color: #6366f1;
    }

    .overlay-tab:hover {
      color: #d4d4d8;
    }

    .overlay-panel {
      display: none;
    }

    .overlay-panel.active {
      display: block;
    }

    .setting-group {
      background: #18181b;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #27272a;
    }

    .setting-group-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #71717a;
      margin-bottom: 10px;
    }

    .setting-row {
      margin-bottom: 10px;
    }

    .setting-row:last-child {
      margin-bottom: 0;
    }

    .setting-row label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #a1a1aa;
      margin-bottom: 4px;
    }

    .setting-row input[type="text"],
    .setting-row input[type="number"],
    .setting-row textarea {
      width: 100%;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 7px 10px;
      color: #e4e4e7;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }

    .setting-row input:focus,
    .setting-row textarea:focus {
      border-color: #6366f1;
    }

    .setting-row textarea {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      min-height: 60px;
      resize: vertical;
    }

    .setting-row.check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
      color: #d4d4d8;
    }

    .tool-toggle-card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 10px 12px;
      transition: border-color 0.15s, background 0.15s;
    }

    .tool-toggle-card:hover {
      border-color: #3f3f46;
      background: #1c1c1f;
    }

    .tool-toggle-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .tool-toggle-card .tool-toggle-name {
      font-size: 12px;
      color: #d4d4d8;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tool-toggle-card .tool-toggle-desc {
      font-size: 10.5px;
      color: #71717a;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tool-toggle-switch {
      position: relative;
      flex-shrink: 0;
    }

    .tool-toggle-switch input {
      display: none;
    }

    .tool-toggle-switch input:checked+.toggle-track {
      background: #6366f1;
    }

    .tool-toggle-switch input:checked+.toggle-track::after {
      transform: translateX(14px);
    }

    .save-btn {
      width: 100%;
      padding: 10px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.15s;
    }

    .save-btn:hover {
      background: #4f46e5;
    }

    .log-box {
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 10px;
      height: 140px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      line-height: 1.6;
      color: #71717a;
      margin-top: 8px;
    }

    .log-box .log-success {
      color: #4ade80;
    }

    .log-box .log-error {
      color: #f87171;
    }

    /* 统计 */
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
      border-bottom: 1px solid #1f1f22;
    }

    .stat-row:last-child {
      border-bottom: none;
    }

    .stat-bar {
      height: 6px;
      background: #3f3f46;
      border-radius: 3px;
      margin: 4px 0 10px;
      overflow: hidden;
    }

    .stat-bar-fill {
      height: 100%;
      background: #6366f1;
      border-radius: 3px;
      transition: width 0.5s ease;
    }

    /* Toast */
    #toast-container {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      background: #18181b;
      border: 1px solid #27272a;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      animation: slideIn 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 260px;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* 文件浏览器 */
    #file-browser-panel {
      width: 0;
      overflow: hidden;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #file-browser-panel.open {
      width: 280px;
      overflow: visible;
    }

    #file-browser-panel.open #fb-listing,
    #file-browser-panel.open #fb-breadcrumb,
    #file-browser-panel.open #file-browser-bar {
      width: 280px;
    }

    #file-browser-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      font-size: 11px;
      color: var(--text-muted);
      min-height: 36px;
      border-bottom: 1px solid var(--border-color);
    }

    #file-browser-bar:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    #fb-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    #fb-header i {
      font-size: 11px;
      color: var(--accent-color);
    }

    #fb-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .fb-btn {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      transition: all 0.15s;
    }

    .fb-btn:hover {
      background: var(--bg-surface);
      color: var(--text-main);
    }

    #fb-breadcrumb {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 4px 12px;
      font-size: 11px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
      white-space: nowrap;
      min-height: 28px;
      scrollbar-width: none;
    }

    #fb-breadcrumb::-webkit-scrollbar {
      display: none;
    }

    .fb-parent-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--accent-color);
      cursor: pointer;
      font-size: 11px;
      flex-shrink: 0;
      transition: all 0.15s;
      padding: 0;
      margin-right: 2px;
    }

    .fb-parent-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.08);
      color: var(--accent-hover);
    }

    .fb-parent-btn:disabled {
      opacity: 0.25;
      cursor: default;
    }

    .fb-crumb {
      cursor: pointer;
      color: var(--accent-color);
      flex-shrink: 0;
      transition: color 0.15s;
    }

    .fb-crumb:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .fb-crumb-sep {
      color: var(--border-color);
      margin: 0 2px;
      flex-shrink: 0;
      font-size: 14px;
      line-height: 1;
    }

    #fb-listing {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    .fb-item {
      display: flex;
      align-items: center;
      padding: 3px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.1s;
      gap: 6px;
      min-height: 28px;
    }

    .fb-item:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .fb-item-icon {
      width: 16px;
      text-align: center;
      flex-shrink: 0;
      font-size: 13px;
    }

    .fb-item-status {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      background: transparent;
      transition: all 0.3s;
    }

    .fb-item-status.used {
      background: #4ade80;
      box-shadow: 0 0 6px rgba(74, 222, 128, 0.6);
    }

    .fb-item-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-main);
    }

    .fb-item-size {
      font-size: 10px;
      color: var(--text-muted);
      flex-shrink: 0;
      margin-left: 8px;
      min-width: 48px;
      text-align: right;
    }

    .fb-item-modified {
      font-size: 10px;
      color: #52525b;
      flex-shrink: 0;
      display: none;
    }

    /* 统计弹窗专用样式 */
    .stat-card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      transition: border-color 0.2s;
    }

    .stat-card:hover {
      border-color: #3f3f46;
    }

    .stat-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .stat-card-title {
      font-size: 13px;
      font-weight: 600;
      color: #d4d4d8;
    }

    .stat-card-total {
      font-size: 16px;
      font-weight: 700;
      color: #818cf8;
      font-family: 'JetBrains Mono', monospace;
    }

    .stat-detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #a1a1aa;
      margin-bottom: 4px;
    }

    .stat-detail-row:last-child {
      margin-bottom: 0;
    }

    .stat-detail-mono {
      font-family: 'JetBrains Mono', monospace;
      color: #d4d4d8;
    }

    .stat-section-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #71717a;
      margin: 16px 0 8px;
    }

    /* 频道管理弹窗专用样式 */
    .channel-item {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      transition: border-color 0.15s;
    }

    .channel-item:hover {
      border-color: #3f3f46;
    }

    .channel-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .channel-item-name {
      font-size: 13px;
      font-weight: 600;
      color: #d4d4d8;
    }

    .channel-field {
      margin-bottom: 6px;
    }

    .channel-field label {
      display: block;
      font-size: 11px;
      color: #71717a;
      margin-bottom: 3px;
    }

    .channel-field input,
    .channel-field select {
      width: 100%;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 5px;
      padding: 6px 8px;
      color: #e4e4e7;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }

    .channel-field input:focus,
    .channel-field select:focus {
      border-color: #6366f1;
    }

    .channel-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .channel-btn {
      flex: 1;
      padding: 6px;
      border-radius: 5px;
      border: none;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }

    .channel-btn.save {
      background: #6366f1;
      color: #fff;
    }

    .channel-btn.save:hover {
      background: #4f46e5;
    }

    .channel-btn.danger {
      background: rgba(244, 63, 94, 0.15);
      color: #f87171;
    }

    .channel-btn.danger:hover {
      background: rgba(244, 63, 94, 0.25);
    }

    .channel-btn.secondary {
      background: #27272a;
      color: #a1a1aa;
    }

    .channel-btn.secondary:hover {
      background: #3f3f46;
      color: #fff;
    }

    .add-channel-btn {
      width: 100%;
      padding: 10px;
      background: #18181b;
      border: 1px dashed #3f3f46;
      border-radius: 8px;
      color: #a1a1aa;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 12px;
      font-family: inherit;
    }

    .add-channel-btn:hover {
      border-color: #6366f1;
      color: #d4d4d8;
      background: rgba(99, 102, 241, 0.05);
    }

    .channel-hint {
      font-size: 11px;
      color: #71717a;
      text-align: center;
      padding: 8px;
      margin-bottom: 8px;
      background: rgba(99, 102, 241, 0.04);
      border-radius: 6px;
      border: 1px solid rgba(99, 102, 241, 0.1);
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- 左侧会话列表 -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <h2>Sessions</h2>
        <button class="sidebar-btn" id="new-session-btn" title="新建会话">+</button>
      </div>
      <div id="session-list"></div>
      <div class="sidebar-footer">
        <span id="current-user-display"
          style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#a1a1aa;">User</span>
        <button class="sidebar-btn" id="data-stats-btn" title="统计" style="width:26px;height:26px;font-size:12px;"><i
            class="fa-solid fa-chart-pie"></i></button>
      </div>
    </aside>

    <!-- 文件浏览器面板（左侧隐藏式） -->
    <div id="file-browser-panel">
      <div id="file-browser-bar">
        <div id="fb-header"><i class="fa-solid fa-folder-open"></i> 文件浏览器</div>
        <div id="fb-actions">
          <button class="fb-btn" id="fb-auto-toggle" title="自动展开"><i class="fa-solid fa-bolt"></i></button>
          <button class="fb-btn" id="fb-refresh" title="刷新"><i class="fa-solid fa-rotate"></i></button>
          <button class="fb-btn" id="fb-collapse" title="收起"><i class="fa-solid fa-chevron-left"></i></button>
        </div>
      </div>
      <div id="fb-breadcrumb"></div>
      <div id="fb-listing">
        <div style="padding:24px 12px;color:#52525b;font-size:12px;text-align:center;">
          <i class="fa-solid fa-folder-open" style="display:block;font-size:24px;margin-bottom:8px;opacity:0.3;"></i>
          点击工具栏按钮打开文件浏览器
        </div>
      </div>
    </div>

    <!-- 主聊天区 -->
    <main id="main">
      <header class="chat-header">
        <div class="chat-header-left">
          <div class="model-selector">
            <button class="model-btn" id="model-dropdown-btn">
              <span class="model-dot" id="connection-status-dot" style="background:#71717a;"></span>
              <span id="model-name-display">加载中...</span>
              <i class="fa-solid fa-chevron-down" style="font-size:9px;color:#71717a;"></i>
            </button>
            <div class="model-dropdown" id="model-dropdown-menu">
              <div id="model-dropdown-list"></div>
            </div>
          </div>
        </div>
        <div class="chat-header-right">
          <button class="icon-btn purple" id="summary-session-btn" title="生成记忆摘要"><i
              class="fa-solid fa-brain"></i></button>
          <button class="icon-btn red" id="clear-session-btn" title="清空上下文"><i
              class="fa-solid fa-trash-can"></i></button>
          <span class="session-id-badge" id="current-session-id-display">ID: -</span>
          <button class="icon-btn" id="file-browser-btn" title="文件浏览器"><i class="fa-solid fa-folder-tree"></i></button>
          <button class="icon-btn" id="settings-gear-btn" title="设置"><i class="fa-solid fa-gear"></i></button>
        </div>
      </header>

      <div id="messages-container">
        <button id="scroll-bottom-btn"><i class="fa-solid fa-arrow-down"></i> 滚动到底部</button>
        <div class="empty-state">
          <i class="fa-solid fa-comments"></i>
          <div style="font-size:16px;font-weight:500;color:#71717a;">未选择会话</div>
          <div style="font-size:13px;margin-top:4px;">请从左侧选择一个会话，或创建新会话。</div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <div class="input-box">
            <div id="image-preview-container"></div>
            <div class="input-row">
              <button class="attach-btn" id="attach-btn" title="上传文件/图片"><i class="fa-solid fa-paperclip"></i></button>
              <input type="file" id="file-upload"
                accept="image/*,.txt,.md,.py,.json,.cpp,.h,.js,.ts,.html,.css,.yaml,.yml,.toml" multiple
                style="display:none;">
              <textarea id="user-input" placeholder="输入消息..." rows="1"></textarea>
              <button id="send-btn" title="发送"><i class="fa-solid fa-arrow-up"></i></button>
            </div>
          </div>
          <div class="input-footer">
            <label class="think-toggle-row">
              <input type="checkbox" id="think-toggle">
              <span class="toggle-track"></span>
              深度思考
            </label>
            <div id="context-usage" style="display:none;align-items:center;gap:8px;">
              <div id="memory-indicator" title="记忆摘要" style="font-size:12px;">
                <i class="fa-solid fa-brain" style="color:#71717a;"></i>
              </div>
              <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:#71717a;">
                <span id="context-bar-container" style="width:70px;height:4px;background:#3f3f46;border-radius:2px;overflow:hidden;display:inline-block;vertical-align:middle;">
                  <span id="context-bar-fill" style="display:block;height:100%;width:0%;background:#6366f1;border-radius:2px;transition:width 0.3s;"></span>
                </span>
                <span id="context-text" style="font-family:'JetBrains Mono',monospace;">0 / 0</span>
              </div>
            </div>
            <span style="font-size:11px;color:#52525b;">Enter 发送 / Shift+Enter 换行</span>
          </div>
        </div>
      </div>
    </main>

    <!-- 设置覆盖层背景 -->
    <div id="overlay-backdrop"></div>

    <!-- 右侧设置覆盖层 -->
    <aside id="settings-overlay" class="side-overlay">
      <div class="overlay-header">
        <h2>系统设置</h2>
        <button class="icon-btn" id="close-settings-btn" style="font-size:16px;"><i
            class="fa-solid fa-times"></i></button>
      </div>
      <div class="overlay-tabs">
        <button class="overlay-tab active" data-otab="settings">配置</button>
        <button class="overlay-tab" data-otab="tools">工具</button>
        <button class="overlay-tab" data-otab="todos">任务</button>
        <button class="overlay-tab" data-otab="channels">频道</button>
        <button class="overlay-tab" data-otab="logs">日志</button>
      </div>
      <div class="overlay-body">
        <div class="overlay-panel active" id="opanel-settings">
          <div id="settings-form-container"></div>
          <button class="save-btn" id="save-settings-btn"><i class="fa-solid fa-floppy-disk"></i> 应用配置</button>
        </div>
        <div class="overlay-panel" id="opanel-tools">
          <div id="tools-header-bar" style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
            <div style="flex:1;position:relative;">
              <i class="fa-solid fa-search"
                style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#52525b;font-size:12px;pointer-events:none;"></i>
              <input type="text" id="tools-search-input" placeholder="搜索工具..."
                style="width:100%;background:#18181b;border:1px solid #27272a;border-radius:6px;padding:7px 10px 7px 28px;color:#e4e4e7;font-size:12px;outline:none;transition:border-color 0.15s;"
                onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='#27272a'"
                oninput="filterTools()">
            </div>
            <span id="tools-enabled-count"
              style="font-size:11px;color:#71717a;background:#18181b;padding:4px 10px;border-radius:5px;border:1px solid #27272a;white-space:nowrap;">0/0</span>
          </div>
          <div id="tools-toggle-list" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;"></div>
        </div>
        <div class="overlay-panel" id="opanel-todos">
          <div style="display:flex;gap:6px;margin-bottom:10px;">
            <input id="new-todo-input" placeholder="新任务..." type="text"
              style="flex:1;background:#18181b;border:1px solid #27272a;border-radius:6px;padding:8px 10px;color:#e4e4e7;font-size:13px;outline:none;">
            <button id="add-todo-btn"
              style="padding:8px 14px;background:#6366f1;border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:12px;"><i
                class="fa-solid fa-plus"></i></button>
          </div>
          <div id="todos-list"></div>
        </div>
        <div class="overlay-panel" id="opanel-channels">
          <div id="channels-list"></div>
        </div>
        <div class="overlay-panel" id="opanel-logs">
          <div class="log-box" id="system-logs">
            <div class="log-success">[System] 核心初始化成功。</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- 统计覆盖层（独立弹窗） -->
    <aside id="stats-overlay" class="side-overlay">
      <div class="overlay-header">
        <h2>使用统计</h2>
        <button class="icon-btn" id="close-stats-btn" style="font-size:16px;"><i class="fa-solid fa-times"></i></button>
      </div>
      <div class="overlay-body" id="stats-overlay-body">
        <div style="padding:40px 20px;text-align:center;color:#52525b;font-size:13px;">加载中...</div>
      </div>
    </aside>

    <!-- 频道管理覆盖层（独立小窗口） -->
    <aside id="channel-overlay" class="side-overlay">
      <div class="overlay-header">
        <h2>频道管理</h2>
        <button class="icon-btn" id="close-channel-btn" style="font-size:16px;"><i
            class="fa-solid fa-times"></i></button>
      </div>
      <div class="overlay-body" id="channel-overlay-body">
        <div style="padding:40px 20px;text-align:center;color:#52525b;font-size:13px;">加载中...</div>
      </div>
    </aside>
  </div>

  <!-- 加载覆盖层 -->
  <div id="loading-overlay">
    <div class="loading-spinner">
      <i class="fa-solid fa-circle-notch fa-spin"></i>
      <div class="loading-text">加载中...</div>
      <div class="loading-sub">正在切换会话，请稍候</div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    // ============ 全局状态 ============
    const state = {
      user: "User", agentName: "assistant",
      sessions: [], currentSessionId: null, messages: [],
      settings: {}, models: [], currentModel: null,
      thinkMode: false, tools: [], todos: [], channels: [],
      isTyping: false, pendingImages: [],
      assistantMsgId: null,
      streamBuffers: { content: '', thinking: '', thinkings: [], toolOutputs: [] },
      contextUsage: { total: 0, max: 1048576 },
      memoryActive: false,
      _scrollAtBottom: true
    };
    const API = '/api';

    // ============ DOM 缓存 ============
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);
    const els = {
      sessionList: $('#session-list'), newSessionBtn: $('#new-session-btn'),
      clearSessionBtn: $('#clear-session-btn'), summarySessionBtn: $('#summary-session-btn'),
      messagesContainer: $('#messages-container'), userInput: $('#user-input'),
      sendBtn: $('#send-btn'), thinkToggle: $('#think-toggle'),
      currentUserDisplay: $('#current-user-display'), systemLogs: $('#system-logs'),
      todosList: $('#todos-list'), newTodoInput: $('#new-todo-input'), addTodoBtn: $('#add-todo-btn'),
      channelsList: $('#channels-list'), currentSessionIdDisplay: $('#current-session-id-display'),
      modelDropdownBtn: $('#model-dropdown-btn'), modelDropdownMenu: $('#model-dropdown-menu'),
      modelDropdownList: $('#model-dropdown-list'), modelNameDisplay: $('#model-name-display'),
      connectionStatusDot: $('#connection-status-dot'),
      attachBtn: $('#attach-btn'), fileUpload: $('#file-upload'),
      imagePreviewContainer: $('#image-preview-container'),
      settingsFormContainer: $('#settings-form-container'), saveSettingsBtn: $('#save-settings-btn'),
      dataStatsBtn: $('#data-stats-btn'), toolsToggleList: $('#tools-toggle-list'),
      settingsGearBtn: $('#settings-gear-btn'), closeSettingsBtn: $('#close-settings-btn'),
      settingsOverlay: $('#settings-overlay'), overlayBackdrop: $('#overlay-backdrop'),
      statsOverlay: $('#stats-overlay'), statsOverlayBody: $('#stats-overlay-body'),
      channelOverlay: $('#channel-overlay'), channelOverlayBody: $('#channel-overlay-body'),
      closeStatsBtn: $('#close-stats-btn'), closeChannelBtn: $('#close-channel-btn'),
      fileBrowserBtn: $('#file-browser-btn'),
      fbPanel: $('#file-browser-panel'),
      fbBreadcrumb: $('#fb-breadcrumb'),
      fbListing: $('#fb-listing'),
      fbRefresh: $('#fb-refresh'),
      fbCollapse: $('#fb-collapse'),
      loadingOverlay: $('#loading-overlay'),
      scrollBottomBtn: $('#scroll-bottom-btn'),
      contextUsage: $('#context-usage'),
      contextBarFill: $('#context-bar-fill'),
      contextText: $('#context-text'),
      memoryIndicator: $('#memory-indicator'),
    };

    // ============ 工具函数 ============
    function toast(msg, type) {
      const icons = { success: 'fa-circle-check text-emerald-400', error: 'fa-circle-exclamation text-rose-400', info: 'fa-circle-info text-blue-400' };
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = `<i class="fa-solid ${icons[type] || icons.info}"></i> ${msg}`;
      $('#toast-container').appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 3000);
    }
    function log(msg, type) {
      const t = new Date().toLocaleTimeString(), d = document.createElement('div');
      d.textContent = `[${t}] ${msg}`;
      d.className = type === 'error' ? 'log-error' : type === 'success' ? 'log-success' : '';
      els.systemLogs.appendChild(d); els.systemLogs.scrollTop = els.systemLogs.scrollHeight;
    }
    function esc(s) { if (!s) return ''; return s.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]); }
    function fixToolTags(text) {
      if (!text) return text;
      return text.replace(/<system_output>([\s\S]*?)<\/system_output>/g, (_, content) => {
        const trimmed = content.trim();
        const hasErr = trimmed.includes('[TOOL_ERR]');
        const hasDone = trimmed.includes('[TOOL_DONE]') || trimmed.includes('[CS_DONE]');
        let statusIcon = '', statusClass = '';
        if (hasErr) { statusIcon = '✗'; statusClass = 'err'; }
        else if (hasDone) { statusIcon = '✓'; statusClass = 'ok'; }
        const cleanContent = trimmed
          .replace(/\[TOOL_DONE\]\n?/g, '')
          .replace(/\[TOOL_ERR\]\n?/g, '')
          .replace(/\[CS_DONE\]\n?/g, '')
          .trim();
        return `\n<details class="sys-output-block">\n<summary>\n<i class="fa-solid fa-chevron-right"></i>\n<i class="fa-solid fa-terminal" style="font-size:11px;"></i>\n<span style="margin-left:4px;font-weight:500;font-size:12px;">系统输出</span>\n<span style="margin-left:auto;font-size:12px;" class="sysout-status ${statusClass}">${statusIcon}</span>\n</summary>\n<div class="sysout-inner">\n<pre><code>${esc(cleanContent)}</code></pre>\n</div>\n</details>\n`;
      });
    }

    // ============ 覆盖层管理 ============
    function openOverlay() { els.settingsOverlay.classList.add('open'); els.overlayBackdrop.classList.add('show'); }
    function closeOverlay() {
      els.settingsOverlay.classList.remove('open');
      els.statsOverlay.classList.remove('open');
      els.channelOverlay.classList.remove('open');
      els.overlayBackdrop.classList.remove('show');
    }
    els.settingsGearBtn.onclick = openOverlay;
    els.closeSettingsBtn.onclick = () => {
      els.settingsOverlay.classList.remove('open');
      if (!els.statsOverlay.classList.contains('open') && !els.channelOverlay.classList.contains('open')) {
        els.overlayBackdrop.classList.remove('show');
      }
    };
    els.closeStatsBtn.onclick = () => {
      els.statsOverlay.classList.remove('open');
      if (!els.settingsOverlay.classList.contains('open') && !els.channelOverlay.classList.contains('open')) {
        els.overlayBackdrop.classList.remove('show');
      }
    };
    els.closeChannelBtn.onclick = () => {
      els.channelOverlay.classList.remove('open');
      if (!els.settingsOverlay.classList.contains('open') && !els.statsOverlay.classList.contains('open')) {
        els.overlayBackdrop.classList.remove('show');
      }
      renderChannels();
      renderSessions();
    };
    els.overlayBackdrop.onclick = closeOverlay;

    // 覆盖层标签切换
    $$('.overlay-tab').forEach(btn => {
      btn.onclick = () => {
        $$('.overlay-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        $$('.overlay-panel').forEach(p => p.classList.remove('active'));
        $(`#opanel-${btn.dataset.otab}`).classList.add('active');
      };
    });

    // ============ 统计弹窗 ============
    function openStatsOverlay() {
      els.statsOverlay.classList.add('open');
      els.overlayBackdrop.classList.add('show');
      loadStatsOverlay();
    }
    async function loadStatsOverlay() {
      const container = els.statsOverlayBody;
      container.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#52525b;font-size:13px;"><i class="fa-solid fa-spinner fa-spin" style="margin-right:6px;"></i>加载中...</div>';
      try {
        const r = await axios.get(API + '/data');
        const usages = r.data?.usages || {};
        const entries = Object.entries(usages);
        if (!entries.length) {
          container.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#71717a;font-size:13px;">暂无使用数据</div>';
          return;
        }
        let totalPrompt = 0, totalCompletion = 0, totalOverall = 0;
        const cards = entries.map(([k, v]) => {
          const pc = v.prompt_cost || 0, cc = v.completion_cost || 0, tc = v.total_cost || (pc + cc);
          totalPrompt += pc; totalCompletion += cc; totalOverall += tc;
          return { name: k, pc, cc, tc };
        }).sort((a, b) => b.tc - a.tc);

        let html = `
          <div class="stat-card" style="background:rgba(99,102,241,0.08);border-color:rgba(99,102,241,0.3);">
            <div class="stat-card-header">
              <span class="stat-card-title" style="color:#a5b4fc;">总消耗</span>
              <span class="stat-card-total" style="color:#c7d2fe;">${totalOverall.toLocaleString()}</span>
            </div>
            <div class="stat-detail-row"><span>Prompt</span><span class="stat-detail-mono">${totalPrompt.toLocaleString()}</span></div>
            <div class="stat-detail-row"><span>Completion</span><span class="stat-detail-mono">${totalCompletion.toLocaleString()}</span></div>
          </div>
          <div class="stat-section-title">各会话详情</div>
        `;
        const maxVal = cards[0]?.tc || 1;
        cards.forEach(item => {
          const pct = (item.tc / maxVal) * 100;
          html += `
            <div class="stat-card">
              <div class="stat-card-header">
                <span class="stat-card-title">${esc(item.name)}</span>
                <span class="stat-card-total">${item.tc.toLocaleString()}</span>
              </div>
              <div class="stat-bar" style="margin-bottom:8px;"><div class="stat-bar-fill" style="width:${pct}%;background:linear-gradient(90deg,#6366f1,#8b5cf6);"></div></div>
              <div class="stat-detail-row"><span style="color:#71717a;">Prompt</span><span class="stat-detail-mono">${item.pc.toLocaleString()}</span></div>
              <div class="stat-detail-row"><span style="color:#71717a;">Completion</span><span class="stat-detail-mono">${item.cc.toLocaleString()}</span></div>
            </div>
          `;
        });
        container.innerHTML = html;
      } catch (e) {
        container.innerHTML = `<div style="padding:40px 20px;text-align:center;color:#f87171;font-size:13px;">加载失败: ${esc(e.message)}</div>`;
      }
    }
    els.dataStatsBtn.onclick = openStatsOverlay;

    // ============ 频道管理弹窗 ============
    function openChannelOverlay() {
      els.channelOverlay.classList.add('open');
      els.overlayBackdrop.classList.add('show');
      renderChannelManager();
    }
    function renderChannelManager() {
      const container = els.channelOverlayBody;
      let html = '';
      if (!state.settings.channels || !state.settings.channels.length) {
        html += '<div style="color:#71717a;font-size:13px;text-align:center;padding:20px;">暂无频道</div>';
      } else {
        html += '<div class="channel-hint"><i class="fa-solid fa-circle-info" style="margin-right:4px;"></i>修改后请点击底部"保存到系统配置"生效</div>';
        html += state.settings.channels.map((c, idx) => `
          <div class="channel-item" data-idx="${idx}">
            <div class="channel-item-header">
              <span class="channel-item-name"><i class="fa-solid fa-hashtag" style="color:#71717a;margin-right:4px;"></i>${esc(c.name)}</span>
              <button class="sidebar-btn" onclick="deleteChannel(${idx})" style="color:#f87171;width:24px;height:24px;" title="删除"><i class="fa-solid fa-trash-can"></i></button>
            </div>
            <div class="channel-field">
              <label>名称</label>
              <input type="text" class="ch-name" value="${esc(c.name)}" placeholder="频道名称">
            </div>
            <div class="channel-field">
              <label>脚本路径</label>
              <input type="text" class="ch-path" value="${esc(c.path || '')}" placeholder="如: sys/tg_bot.py">
            </div>
            <div class="channel-field">
              <label>状态</label>
              <select class="ch-status">
                <option value="active" ${c.status === 'active' ? 'selected' : ''}>active</option>
                <option value="inactive" ${c.status === 'inactive' ? 'selected' : ''}>inactive</option>
              </select>
            </div>
            <div class="channel-actions">
              <button class="channel-btn save" onclick="saveChannel(${idx})"><i class="fa-solid fa-check"></i> 更新</button>
            </div>
          </div>
        `).join('');
      }
      html += `<button class="add-channel-btn" onclick="addChannelForm()"><i class="fa-solid fa-plus"></i> 添加新频道</button>`;
      if (state.settings.channels && state.settings.channels.length) {
        html += `<button class="save-btn" onclick="persistChannelSettings()" style="margin-top:4px;"><i class="fa-solid fa-floppy-disk"></i> 保存到系统配置</button>`;
      }
      container.innerHTML = html;
    }
    function addChannelForm() {
      const container = els.channelOverlayBody;
      const addBtn = container.querySelector('.add-channel-btn');
      if (addBtn) addBtn.remove();
      const div = document.createElement('div');
      div.className = 'channel-item';
      div.style.borderColor = '#6366f1';
      div.innerHTML = `
        <div class="channel-item-header"><span class="channel-item-name" style="color:#a5b4fc;">新频道</span></div>
        <div class="channel-field"><label>名称</label><input type="text" class="ch-name-new" placeholder="频道名称"></div>
        <div class="channel-field"><label>脚本路径</label><input type="text" class="ch-path-new" placeholder="如: sys/tg_bot.py"></div>
        <div class="channel-field"><label>状态</label><select class="ch-status-new"><option value="active">active</option><option value="inactive">inactive</option></select></div>
        <div class="channel-actions">
          <button class="channel-btn save" onclick="commitNewChannel()"><i class="fa-solid fa-check"></i> 创建</button>
          <button class="channel-btn secondary" onclick="renderChannelManager()"><i class="fa-solid fa-times"></i> 取消</button>
        </div>
      `;
      container.appendChild(div);
    }
    function commitNewChannel() {
      const name = $('.ch-name-new')?.value.trim();
      const path = $('.ch-path-new')?.value.trim() || '';
      const status = $('.ch-status-new')?.value || 'active';
      if (!name) { toast('频道名称不能为空', 'error'); return; }
      if (state.settings.channels.find(c => c.name === name)) { toast('频道名称已存在', 'error'); return; }
      state.settings.channels.push({ name, path, status, user_count: 1 });
      toast('频道已添加', 'success');
      renderChannelManager();
    }
    function saveChannel(idx) {
      const item = els.channelOverlayBody.querySelector(`[data-idx="${idx}"]`);
      if (!item) return;
      const name = item.querySelector('.ch-name')?.value.trim();
      const path = item.querySelector('.ch-path')?.value.trim();
      const status = item.querySelector('.ch-status')?.value;
      if (!name) { toast('频道名称不能为空', 'error'); return; }
      if (state.settings.channels.find((c, i) => c.name === name && i !== idx)) { toast('频道名称已存在', 'error'); return; }
      state.settings.channels[idx] = { ...state.settings.channels[idx], name, path, status };
      toast('频道已更新', 'success');
      renderChannelManager();
    }
    function deleteChannel(idx) {
      if (!confirm('确定删除此频道？')) return;
      state.settings.channels.splice(idx, 1);
      toast('频道已删除', 'success');
      renderChannelManager();
    }
    async function persistChannelSettings() {
      await saveSettings();
      toast('频道配置已保存到系统', 'success');
    }

    // ============ 设置表单 ============
    function renderSettingsForm(s) {
      els.settingsFormContainer.innerHTML = `
    <div class="setting-group">
      <div class="setting-group-title">基本信息</div>
      <div class="setting-row"><label>用户昵称</label><input type="text" id="s-user_name" value="${esc(s.user_name || '')}"></div>
      <div class="setting-row"><label>Agent昵称</label><input type="text" id="s-agent_name" value="${esc(s.agent_name || '')}"></div>
      <div class="setting-row"><label>工作区路径</label><input type="text" id="s-workspace" value="${esc(s.workspace || '')}"></div>
      <div class="setting-row"><label>服务器地址</label><input type="text" id="s-server_address" value="${esc(s.server_address || '')}"></div>
      <div class="setting-row"><label>默认模型</label><input type="text" id="s-model" value="${esc(s.model || '')}"></div>
      <div class="setting-row"><label>系统提示词</label><input type="text" id="s-prompt" value="${esc(s.prompt || '')}"></div>
    </div>
    <div class="setting-group">
      <div class="setting-group-title">运行参数</div>
      <div class="setting-row check-row"><input type="checkbox" id="s-stream" ${s.stream ? 'checked' : ''}><label for="s-stream">启用流式传输</label></div>
      <div class="setting-row"><label>最大工具/系统调用轮数</label><input type="number" id="s-max_mpc_rounds" value="${s.max_mpc_rounds || 5}" min="1" max="50"></div>
      <div class="setting-row"><label>上下文窗口大小</label><input type="number" id="s-max_context" value="${s.max_context || 1048576}" min="1000"></div>
      <div class="setting-row check-row"><input type="checkbox" id="s-auto_expand_files" ${s.auto_expand_files !== false ? 'checked' : ''}><label for="s-auto_expand_files">文件浏览器自动展开（工具调用时）</label></div>
    </div>
    <div class="setting-group">
      <div class="setting-group-title">频道配置</div>
      <div class="setting-row">
        <button class="save-btn" onclick="openChannelOverlay()" style="margin-top:0;background:#3f3f46;font-size:12px;"><i class="fa-solid fa-sliders"></i> 打开频道管理器</button>
        <div style="font-size:11px;color:#71717a;margin-top:6px;">当前频道数: ${(s.channels || []).length}</div>
      </div>
    </div>
  `;
    }
    async function loadSettings() {
      try { const r = await axios.post(API + '/settings', { updata: false }); state.settings = r.data; state.channels = state.settings.channels || []; } catch (e) { toast('加载设置失败', 'error'); }
      renderSettingsForm(state.settings);
    }
    async function saveSettings() {
      const ns = {
        user_name: $('#s-user_name')?.value || '', agent_name: $('#s-agent_name')?.value || '',
        workspace: $('#s-workspace')?.value || '', server_address: $('#s-server_address')?.value || '',
        model: $('#s-model')?.value || '', prompt: $('#s-prompt')?.value || '',
        stream: $('#s-stream')?.checked || false,
        auto_expand_files: $('#s-auto_expand_files')?.checked !== false,
        max_mpc_rounds: parseInt($('#s-max_mpc_rounds')?.value) || 5,
        max_context: parseInt($('#s-max_context')?.value) || 1048576,
        channels: state.settings.channels || []
      };
      state.settings = ns;
      try {
        const r = await axios.post(API + '/settings', { updata: true, settings: ns });
        state.settings = r.data; state.channels = state.settings.channels || []; toast('设置已保存', 'success'); log('配置更新成功', 'success');
        await getModels();
      } catch (e) { toast('保存失败', 'error'); }
    }
    els.saveSettingsBtn.onclick = saveSettings;

    // ============ 文件上传 ============
    els.attachBtn.onclick = () => els.fileUpload.click();
    function compressImage(file, maxRes = 1024, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxRes || h > maxRes) { if (w > h) { h = Math.round(h * maxRes / w); w = maxRes; } else { w = Math.round(w * maxRes / h); h = maxRes; } }
            const c = document.createElement('canvas'); c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(c.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject; img.src = e.target.result;
        };
        r.readAsDataURL(file);
      });
    }
    els.fileUpload.onchange = async (e) => {
      for (const f of e.target.files || []) {
        if (f.type.startsWith('image/')) { try { state.pendingImages.push(await compressImage(f)); renderImagePreviews(); } catch { } }
        else { const fr = new FileReader(); fr.onload = () => { els.userInput.value += (els.userInput.value.trim() ? '\n\n' : '') + `[${f.name}]\n${fr.result}`; els.userInput.dispatchEvent(new Event('input')); }; fr.readAsText(f); }
      }
      els.fileUpload.value = '';
    };
    function renderImagePreviews() {
      els.imagePreviewContainer.innerHTML = state.pendingImages.map((img, i) =>
        `<div class="img-preview"><img src="${img}"><button class="rm-btn" onclick="removePending(${i})"><i class="fa-solid fa-times"></i></button></div>`
      ).join('');
    }
    window.removePending = (i) => { state.pendingImages.splice(i, 1); renderImagePreviews(); };

    // ============ 加载动画 ============
    function showLoading(text) {
      const overlay = els.loadingOverlay;
      if (text) overlay.querySelector('.loading-text').textContent = text;
      overlay.classList.add('active');
    }
    function hideLoading() {
      els.loadingOverlay.classList.remove('active');
      els.loadingOverlay.querySelector('.loading-text').textContent = '加载中...';
    }

    // ============ 滚动冻结控制 ============
    function isScrolledToBottom() {
      const c = els.messagesContainer;
      return c.scrollHeight - c.scrollTop - c.clientHeight < 80;
    }
    function scrollToBottom() {
      els.messagesContainer.scrollTop = els.messagesContainer.scrollHeight;
    }
    function updateScrollState() {
      const atBottom = isScrolledToBottom();
      state._scrollAtBottom = atBottom;
      els.scrollBottomBtn.classList.toggle('show', !atBottom);
    }
    els.messagesContainer.addEventListener('scroll', updateScrollState);
    els.scrollBottomBtn.onclick = () => { scrollToBottom(); els.scrollBottomBtn.classList.remove('show'); };

    // ============ 上下文使用显示 ============
    function updateContextUsage(usage) {
      if (!usage || !state.settings.max_context) {
        els.contextUsage.style.display = 'none';
        return;
      }
      els.contextUsage.style.display = 'flex';
      const total = usage.total_cost || usage.prompt_cost + usage.completion_cost || 0;
      const max = state.settings.max_context || 1048576;
      const pct = Math.min(100, (total / max) * 100);
      els.contextBarFill.style.width = pct + '%';
      els.contextText.textContent = `${total.toLocaleString()} / ${max.toLocaleString()}`;
    }
    function updateMemoryIndicator(active) {
      state.memoryActive = active;
      const icon = els.memoryIndicator.querySelector('i');
      if (active) {
        icon.style.color = '#818cf8';
        els.memoryIndicator.title = '记忆摘要已启用';
      } else {
        icon.style.color = '#71717a';
        els.memoryIndicator.title = '记忆摘要未启用';
      }
    }

    // ============ 会话管理 ============
    async function loadSessions() {
      try {
        const r = await axios.get(API + '/session'); state.sessions = r.data.session_list || []; renderSessions();
        if (state.sessions.length > 0 && !state.currentSessionId) {
          await switchSession(state.sessions[0]);
        } else if (state.sessions.length === 0) {
          await newSession();
        } else {
          state.currentSessionId = null;
          els.currentSessionIdDisplay.textContent = 'ID: -';
        }
      } catch (e) { log('加载会话列表失败', 'error'); }
    }
    function renderSessions() {
      els.sessionList.innerHTML = '';
      state.sessions.forEach(id => {
        const isActive = id === state.currentSessionId;
        const isChannel = state.channels.some(c => c.name === id);
        const div = document.createElement('div');
        div.className = `session-item${isActive ? ' active' : ''}`;
        div.innerHTML = `<span class="sess-name" title="${esc(id)}">${esc(id)}</span>` + (isChannel ? '' : `<button class="del-btn" title="删除"><i class="fa-solid fa-trash-can"></i></button>`);
        div.querySelector('.sess-name')?.addEventListener('click', () => switchSession(id));
        const delBtn = div.querySelector('.del-btn');
        if (delBtn) delBtn.addEventListener('click', (ev) => { ev.stopPropagation(); deleteSession(id); });
        els.sessionList.appendChild(div);
      });
    }
    async function switchSession(sid) {
      if (state.isTyping) { toast('请等待当前生成完成', 'error'); return; }
      showLoading('切换会话中...');
      try {
        const r = await axios.post(API + '/session/msg', { session_id: sid });
        state.currentSessionId = sid;
        els.currentSessionIdDisplay.textContent = `ID: ${sid}`;
        state.messages = parseMessages(r.data.messages || []);
        renderMessages(); renderSessions(); log(`已切换到: ${sid}`, 'success');
        // 检查是否有记忆摘要
        const hasMemory = state.messages.some(m => m.role === 'memory');
        updateMemoryIndicator(hasMemory);
        // 估算上下文用量
        const totalChars = JSON.stringify(r.data.messages || []).length;
        updateContextUsage({ total_cost: totalChars });
      } catch (e) { toast('无法加载会话', 'error'); }
      finally { hideLoading(); }
    }
    async function newSession() {
      if (state.isTyping) { toast('请等待当前生成完成', 'error'); return; }
      try {
        const r = await axios.post(API + '/session/new');
        if (r.data.status === 'OK') { const nid = r.data.session_id; if (!state.sessions.includes(nid)) state.sessions.push(nid); await switchSession(nid); renderSessions(); toast('新会话已创建', 'success'); }
      } catch (e) { toast('创建失败', 'error'); }
    }
    async function deleteSession(sid) {
      if (!confirm(`确认删除会话 ${sid}？此操作不可撤销。`)) return;
      try {
        const r = await axios.post(API + '/session/delete', { session_id: sid });
        if (r.data.status === 'deleted') { state.sessions = state.sessions.filter(s => s !== sid); renderSessions(); if (state.currentSessionId === sid && state.sessions.length > 0) await switchSession(state.sessions[0]); else if (state.sessions.length === 0) await newSession(); toast('会话已删除', 'success'); }
      } catch (e) { toast('删除失败: ' + (e.response?.data?.error || e.message), 'error'); }
    }
    async function clearSession() {
      if (!state.currentSessionId || !confirm('清空当前会话的全部上下文？')) return;
      try { await axios.post(API + '/session/clear'); await switchSession(state.currentSessionId); toast('上下文已清空', 'success'); } catch (e) { toast('清空失败', 'error'); }
      updateContextUsage(null);
      updateMemoryIndicator(false);
    }
    async function genMemory() {
      if (!state.currentSessionId || !confirm('为当前会话生成记忆摘要？')) return;
      const btn = els.summarySessionBtn, orig = btn.innerHTML; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; btn.disabled = true;
      try { const r = await axios.post(API + '/session/memory'); if (r.data.status === 'done') { toast('记忆已更新', 'success'); updateMemoryIndicator(true); } } catch (e) { toast('记忆生成失败', 'error'); }
      finally { btn.innerHTML = orig; btn.disabled = false; }

    </button>`
